<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<style>
:root { --ink: #0f1d1c; --cream: #f5ecd9; --gold: #e2b866; --teal: #2c6a65; --mint: #6fcf97; --coral: #ff8a65; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); font-family: Inter, system-ui, sans-serif; color: var(--cream); }
.scene { position: absolute; inset: 0; opacity: 0; }
.dark { background: radial-gradient(ellipse at 50% 55%, #17312e, var(--ink) 72%); }
.serif { font-family: Marcellus, Georgia, serif; font-weight: 400; }
.eyebrow { font: 600 22px Inter; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); }
.c { display: grid; place-items: center; text-align: center; }
/* hook */
#hook h1 { font-size: 190px; line-height: 1; }
#hook h1 span { display: inline-block; opacity: 0; }
#hook p { margin-top: 34px; font-size: 38px; color: rgba(245,236,217,.82); opacity: 0; }
/* browser frame + camera */
.frame { position: absolute; border-radius: 18px; overflow: hidden; background: #0b1416; box-shadow: 0 40px 90px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08); }
.bar { position: relative; z-index: 3; height: 44px; display: flex; align-items: center; gap: 9px; padding: 0 18px; background: #e9e6df; }
.bar i { width: 13px; height: 13px; border-radius: 50%; background: #c9c3b8; }
.bar b { margin-left: 18px; padding: 6px 18px; border-radius: 999px; background: #fff; font: 500 17px Inter; color: #6b6b6b; }
.frame.new .bar { background: #1d2b2a; } .frame.new .bar i { background: #3c4b49; } .frame.new .bar b { background: #0f1d1c; color: #c8c0ad; }
.view { position: absolute; left: 0; right: 0; top: 44px; bottom: 0; overflow: hidden; }
.layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; opacity: 0; }
.layer img { display: block; width: 100%; height: 100%; }
.hl { position: absolute; border-radius: 12px; border: 5px solid var(--coral); box-shadow: 0 0 0 5000px rgba(4,10,12,.0), 0 0 40px rgba(255,138,101,.55); opacity: 0; }
.solved .hl { border-color: var(--mint); box-shadow: 0 0 0 5000px rgba(4,10,12,.0), 0 0 40px rgba(111,207,151,.55); }
/* side panel */
.gh { position: absolute; left: 80px; top: 70px; display: flex; align-items: baseline; gap: 22px; }
.gh .num { font: 400 34px Marcellus; color: var(--gold); }
.gh h2 { font-size: 64px; }
.gh .q { font: 600 20px Inter; letter-spacing: .22em; text-transform: uppercase; color: rgba(245,236,217,.6); margin-left: 8px; }
.panel { position: absolute; left: 1360px; top: 300px; width: 480px; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px 10px 12px; border-radius: 999px; font: 700 20px Inter; letter-spacing: .18em; text-transform: uppercase; }
.pill svg { width: 28px; height: 28px; }
.problem .pill { background: rgba(255,138,101,.14); color: var(--coral); border: 1px solid rgba(255,138,101,.45); }
.solved .pill { background: var(--mint); color: #0f2a22; }
.panel h3 { margin-top: 28px; font: 400 54px/1.1 Marcellus; }
.panel p { margin-top: 24px; font: 400 28px/1.5 Inter; color: rgba(245,236,217,.82); }
.panel .fix { margin-top: 26px; padding-top: 20px; border-top: 1px solid rgba(245,236,217,.18); font: 500 21px/1.45 Inter; color: rgba(245,236,217,.6); }
.panel .fix b { color: var(--coral); font-weight: 600; }
/* gaps */
#gaps .gh2 { position: absolute; left: 0; right: 0; top: 140px; text-align: center; }
#gaps .gh2 h2 { font-size: 72px; margin-top: 18px; }
#gaps .grid { position: absolute; left: 110px; right: 110px; top: 400px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; }
.gap { padding: 34px 30px 36px; border-radius: 22px; background: rgba(245,236,217,.06); border: 1px solid rgba(226,184,102,.28); opacity: 0; }
.gap .n { font: 400 64px/1 Marcellus; color: var(--gold); }
.gap h3 { font: 400 40px/1.15 Marcellus; margin-top: 18px; }
.gap .q { font: 600 18px Inter; letter-spacing: .2em; text-transform: uppercase; color: rgba(226,184,102,.85); margin-top: 10px; }
.gap p { margin-top: 22px; font: 400 25px/1.45 Inter; color: rgba(245,236,217,.8); }
/* before */
#before .t { position: absolute; left: 110px; top: 300px; width: 560px; }
#before h2 { font-size: 84px; line-height: 1.05; margin-top: 22px; }
#before p { margin-top: 28px; font-size: 34px; line-height: 1.45; color: rgba(245,236,217,.8); }
/* mascot */
#meet .stage { position: absolute; left: 150px; top: 150px; width: 760px; height: 780px; }
#meet .hero { position: absolute; left: 90px; top: 60px; width: 600px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.45)); }
#meet .mini { position: absolute; width: 170px; filter: drop-shadow(0 14px 20px rgba(0,0,0,.4)); opacity: 0; }
#meet .t { position: absolute; left: 1000px; top: 330px; width: 780px; }
#meet h2 { font-size: 110px; margin-top: 18px; }
#meet p { margin-top: 28px; font-size: 36px; line-height: 1.5; color: rgba(245,236,217,.85); }
#meet .scarf { display: inline-block; margin-top: 30px; padding: 12px 22px; border-radius: 999px; background: rgba(44,106,101,.5); border: 1px solid rgba(111,207,151,.4); font: 600 22px Inter; letter-spacing: .08em; color: var(--cream); opacity: 0; }
/* 24/7 */
#always .dial { position: absolute; left: 50%; top: 150px; width: 560px; height: 560px; margin-left: -280px; }
#always .big { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 400 210px/1 Marcellus; color: var(--gold); text-shadow: 0 0 60px rgba(226,184,102,.35); }
#always .sub { position: absolute; left: 0; right: 0; top: 770px; text-align: center; }
#always .sub b { display: block; font: 400 56px Marcellus; }
#always .sub span { display: block; margin-top: 16px; font: 400 32px Inter; color: rgba(245,236,217,.8); }
#always .eyebrow { position: absolute; left: 0; right: 0; top: 80px; text-align: center; }
#always .cat { position: absolute; width: 230px; right: 330px; top: 320px; filter: drop-shadow(0 18px 26px rgba(0,0,0,.4)); }
#always .ic { position: absolute; width: 70px; height: 70px; color: var(--gold); }
/* mission */
#mission { background: var(--cream); color: var(--ink); }
#mission .eyebrow { color: #a36d1d; }
#mission h2 { font-size: 96px; line-height: 1.1; margin-top: 26px; }
#mission p { margin-top: 34px; font-size: 44px; line-height: 1.35; color: #2c4a46; }
#mission .l { display: block; opacity: 0; }
/* outro */
.wm { font: 400 150px Marcellus; letter-spacing: .06em; display: inline-block; }
.wm i { font: italic 400 54px Georgia, serif; color: rgba(245,236,217,.7); margin-right: 18px; }
.wm sup { font: 700 30px Inter; color: var(--gold); letter-spacing: .2em; position: relative; top: 26px; margin-left: 8px; }
.n2 { margin-top: 18px; font: 400 40px Marcellus; letter-spacing: .38em; color: var(--gold); }
.mean { margin-top: 24px; font: 500 28px Inter; letter-spacing: .08em; color: rgba(245,236,217,.85); text-transform: uppercase; }
.mean b { color: var(--gold); }
.cta { margin-top: 56px; display: inline-flex; align-items: center; gap: 18px; padding: 24px 44px; border-radius: 999px; background: var(--gold); color: #1d1608; font: 700 38px Inter; }
.cta svg { width: 34px; height: 22px; }
.url { margin-top: 22px; font: 500 32px Inter; color: rgba(245,236,217,.85); }
#outro .cat { position: absolute; width: 230px; right: 160px; bottom: 120px; filter: drop-shadow(0 18px 26px rgba(0,0,0,.4)); }
/* credits */
#credits { background: var(--cream); color: var(--ink); }
#credits .film { font: 600 22px Inter; letter-spacing: .3em; text-transform: uppercase; color: #6b5a3a; }
#credits .rr { margin-top: 18px; font: 400 76px Marcellus; letter-spacing: .04em; }
#credits .sup { margin-top: 90px; font: 600 20px Inter; letter-spacing: .3em; text-transform: uppercase; color: #6b5a3a; }
#credits .logos { margin-top: 40px; display: flex; align-items: center; justify-content: center; gap: 86px; }
#credits .logos > * { opacity: 0; }
#credits .cl { display: grid; justify-items: center; gap: 8px; }
#credits .cl small { font: 600 20px Inter; letter-spacing: .08em; color: #3d3a33; }
</style></head>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="ok" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#0f2a22"/><path d="M7 12.5l3.2 3.2L17.2 8.7" fill="none" stroke="#6fcf97" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>

<div id="root"></div>
<script>
const LANG = (location.search.match(/lang=(id|en)/) || [, 'en'])[1];
const T = {

    s1: ['A calm film, its own art and type', 'Slow footage, a warm palette and the Marcellus wordmark. It feels safe before you read a word.'],

    d2: ['When people really need it', 'Late-night peaks show why support has to be there 24/7.'],
    d3: ['From data to action', 'Suggested steps update with the numbers, ready for the next meeting.'],
    d4: ['One console, Map and Analytics', 'Map, trends and analytics in one place, with a report you can download as PDF.'],
    d5: ['Who needs help', 'Names masked. The clinical team sees serious signals early: signals, not diagnoses.'], dPill: 'Main feature',
    cta: 'Book a pilot demo', film: 'A film by', sup: 'Supported by', forStartups: 'for Startups',
  },
  id: {
    hook1: 'Sebelum.', hook2: 'Sesudah.', hookSub: 'Apa yang kurang dari tenang.ai, dan solusinya di N2CIAS.',
    beforeEye: 'Sebelum', beforeH: 'tenang.ai versi lama.', beforeP: 'Informasinya lengkap, tetapi belum merepresentasikan tenang.ai seluruhnya.',
    gapsEye: 'Apa yang kurang', gapsH: 'Empat hal yang perlu dibenahi.',
    problem: 'Problem', solved: 'Solved', fixes: 'Fix untuk:',
    gaps: [['Look & feel', 'Kesan pertama', 'Template sudah rapi, tetapi belum merepresentasikan Tenang.'], ['Character', 'Teman bicaranya siapa', 'Nesya sudah ada, tetapi belum memiliki karakter.'], ['Credibility', 'Kenapa bisa dipercaya', 'Partner sudah ada, tetapi belum terlihat jelas.'], ['Story', 'Kenapa N2CIAS ada', 'Nama N2CIAS sudah ada, tetapi belum dijelaskan.']],
    p1: ['Template ada, tetapi belum mewakili Tenang', 'Informasinya lengkap, tetapi tampilannya belum merepresentasikan rasa tenang.'],
    s1: ['Film yang calm, visual dan font sendiri', 'Footage pelan, warna hangat, dan wordmark Marcellus. Terasa aman sebelum mulai membaca.'],

    p3: ['Partner ada, tetapi belum terlihat', 'Universitas sudah disebut, tetapi hanya di satu baris kecil, dan belum ada halaman research.'],
    s3: ['Partner di depan, research bisa dibaca', 'Logo partner ada di layar pertama, dan reading list menunjukkan studi di balik Nesya.'],
    p4: ['Nama ada, tetapi belum dijelaskan', 'N2CIAS sudah ada, tetapi belum dijelaskan mengapa ia ada dan apa arti namanya.'],
    s4: ['Story dari ELIZA, dan nama yang bermakna', 'Gallery berjalan dari ELIZA (1966) ke N2CIAS, dan namanya dijelaskan huruf demi huruf.'],
    meetEye: 'Kenalan dengan maskot', meetH: 'Ini Nesya.', meetP: 'Gajah sumatra kecil dengan syal teal berbintik. Gajah tak pernah lupa, dan ia mendengarkan tanpa menghakimi.', meetTag: 'Gajah sumatra · syal teal · siap mendengar',

    dEye: 'Untuk institusi', dH: 'Satu dashboard. Gambaran utuh.', dP: 'Lihat di mana dukungan dibutuhkan, tanpa melihat siapa yang bercerita.',
    d1: ['Peta 30 hari, sekali lihat', 'Topik yang tinggi, beban emosional, dan check-in sepanjang bulan, per institusi.'],

document.documentElement.lang = LANG;
const RECTS = __RECTS__;
const R = (img, key) => RECTS[LANG + '/' + img][key];

  { id: 'p1', a: 13, b: 17, kind: 'problem', g: 0, txt: T.p1, shots: [{ img: 'old-hero', box: 'h1', at: 13 }] },

const add = (html) => { root.insertAdjacentHTML('beforeend', html); };

add(`<section class="scene dark" id="meet"><div class="stage">

  <svg class="dial" viewBox="0 0 760 760"><circle cx="380" cy="380" r="350" fill="none" stroke="rgba(226,184,102,.18)" stroke-width="2"/>

  <div class="big">24/7</div>
  <svg class="ic" id="moon" style="left:420px; top:395px"><use href="#moon"/></svg><svg class="ic" id="sun" style="left:420px; top:395px"><use href="#sun"/></svg>
  <img class="cat" id="acat" src="nesya/sleepy.png">

const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const inout = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const fadeIO = (t, a, b, f = .35) => clamp(Math.min((t - a) / f, (b - t) / f));
const $ = (s, el = document) => el.querySelector(s);
function rise(el, t, at, dur = .6, dy = 40) { const k = ease((t - at) / dur); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; }

// camera: show the whole page, then push in slowly so the box fills about two thirds of the view
function camera(layer, box, t, at, end) {
  const bw = box[2] - box[0], bh = box[3] - box[1];
  const zt = clamp(Math.min(.66 / bw, (.62 * VH) / (bh * VW / 1.6)), 1, 2.1);
  const k = inout((t - at - .3) / 1.6);
  const z = 1 + (zt - 1) * k + .015 * clamp((t - at) / (end - at));
  const iw = VW * z, ih = iw / 1.6;
  const fx = .5 + ((box[0] + box[2]) / 2 - .5) * k, fy = .3 + ((box[1] + box[3]) / 2 - .3) * k;
  const x = clamp(VW / 2 - fx * iw, VW - iw, 0), y = clamp(VH / 2 - fy * ih, Math.min(0, VH - ih), 0);
  layer.style.width = iw + 'px'; layer.style.height = ih + 'px'; layer.style.transform = `translate(${x}px, ${y}px)`;
  const hl = $('.hl', layer), pad = 10;
  hl.style.left = (box[0] * iw - pad) + 'px'; hl.style.top = (box[1] * ih - pad) + 'px';
  hl.style.width = (bw * iw + pad * 2) + 'px'; hl.style.height = (bh * ih + pad * 2) + 'px';
  const h = ease((t - at - 1.5) / .5); hl.style.opacity = h;
  const dim = .5 * h; const col = hl.closest('.solved') ? '111,207,151' : '255,138,101';
  hl.style.boxShadow = `0 0 0 5000px rgba(4,10,12,${dim}), 0 0 ${30 + 20 * Math.sin(t * 4) ** 2}px rgba(${col},.6)`;
}

window.render = function (t) {
  const hook = $('#hook'); hook.style.opacity = fadeIO(t, -1, 3, .35);
  const hs = hook.querySelectorAll('h1 span'); rise(hs[0], t, .5, .5, 60); rise(hs[1], t, 1.0, .5, 60); rise($('p', hook), t, 1.7, .6, 24);
  const bf = $('#before'); bf.style.opacity = fadeIO(t, 3, 8);
  rise($('.t', bf), t, 3.1, .7, 30);
  const fr = $('#bf'); const k = ease((t - 3) / 1); fr.style.opacity = k; fr.style.transform = `translateY(${(1 - k) * 60}px)`;
  const ly = $('.layer', fr); const sc = clamp((t - 4.5) / 3.3); ly.style.transform = `translateY(${-sc * 0}px) scale(${1 + .04 * sc})`;
  const g = $('#gaps'); g.style.opacity = fadeIO(t, 8, 13);
  rise($('.gh2', g), t, 8.05, .5, 20); g.querySelectorAll('.gap').forEach((c, i) => rise(c, t, 8.5 + i * .5, .5, 40));
  SCENES.forEach(s => {
    const el = $('#' + s.id); el.style.opacity = fadeIO(t, s.a, s.b);
    rise($('.gh', el), t, s.a, .5, 20);
    rise($('.pill', el), t, s.a + 1.6, .45, 14); rise($('h3', el), t, s.a + 1.9, .5, 18); rise($('p', el), t, s.a + 2.2, .5, 18);
    const fx = $('.fix', el); if (fx) rise(fx, t, s.a + 2.6, .5, 12);
    const layers = el.querySelectorAll('.layer');
    s.shots.forEach((sh, i) => {
      const end = i + 1 < s.shots.length ? s.shots[i + 1].at : s.b;
      const L = layers[i]; L.style.opacity = i === 0 ? clamp((end + .3 - t) / .35) : clamp(Math.min((t - sh.at) / .35, (end + .3 - t) / .35));
      camera(L, R(sh.img, sh.box), t, sh.at, end);
    });
  });
  // meet Nesya 29–34
  const m = $('#meet'); m.style.opacity = fadeIO(t, 29, 34);
  const w = $('#wave'); const wk = ease((t - 29.1) / .7); w.style.opacity = wk; w.style.transform = `translateY(${(1 - wk) * 80 + Math.sin(t * 2.2) * 8}px) rotate(${Math.sin(t * 1.6) * 1.5}deg)`;
  const fr8 = Math.floor((t - 29) / .25); w.src = 'nesya/wave-' + [1, 1, 2, 3, 2, 3, 2, 1][((fr8 % 8) + 8) % 8] + '.png';
  m.querySelectorAll('.mini').forEach((mi, i) => { const k2 = ease((t - 30.2 - i * .5) / .5); mi.style.opacity = k2; mi.style.transform = `translateY(${(1 - k2) * 30 + Math.sin(t * 2 + i) * 10}px) rotate(${(i - 1) * 6}deg)`; });
  rise($('.t .eyebrow', m), t, 29.3, .5, 16); rise($('.t h2', m), t, 29.6, .6, 30); rise($('.t p', m), t, 30.3, .6, 20); rise($('.scarf', m), t, 31.2, .5, 12);
  // 24/7 34–39
  const al = $('#always'); al.style.opacity = fadeIO(t, 34, 39);
  rise($('.eyebrow', al), t, 34.1, .5, 14);
  const bk = ease((t - 34.4) / .8); const big = $('.big', al); big.style.opacity = bk; big.style.transform = `scale(${.85 + .15 * bk})`;
  const turn = clamp((t - 34.3) / 4.2); const ang = turn * Math.PI * 2;
  $('#dot').setAttribute('cx', 380 + Math.sin(ang) * 350); $('#dot').setAttribute('cy', 380 - Math.cos(ang) * 350);
  const large = ang > Math.PI ? 1 : 0; $('#arc').setAttribute('d', turn < .001 ? '' : turn > .999 ? 'M380 30 A350 350 0 1 1 379.9 30' : `M380 30 A350 350 0 ${large} 1 ${380 + Math.sin(ang) * 350} ${380 - Math.cos(ang) * 350}`);
  const night = Math.cos(ang) > 0 ? 1 : 0; const mk = clamp((t - 34.6) / .4);
  $('#moon').style.opacity = mk * (Math.cos(ang) > 0 ? 1 : .0) ; $('#sun').style.opacity = mk * (Math.cos(ang) > 0 ? 0 : 1);
  const ac = $('#acat'); ac.src = t < 36.4 ? 'nesya/sleepy.png' : 'nesya/happy.png'; const ak = ease((t - 34.8) / .6); ac.style.opacity = ak; ac.style.transform = `translateY(${(1 - ak) * 40 + Math.sin(t * 2.5) * 6}px)`;
  rise($('.sub b', al), t, 35.3, .6, 20); rise($('.sub span', al), t, 35.9, .6, 16);
  // mission 60–65
  const mi = $('#mission'); mi.style.opacity = fadeIO(t, 60, 65);
  rise($('.eyebrow', mi), t, 60.1, .4, 12); mi.querySelectorAll('.l').forEach((l, i) => rise(l, t, 60.3 + [0, .5, 1.6, 2.2][i], .6, 26));
  // outro 65–69
  const o = $('#outro'); o.style.opacity = fadeIO(t, 65, 69);
  rise($('.wm', o), t, 65.1, .6, 30); rise($('.n2', o), t, 65.5, .5, 16); rise($('.mean', o), t, 65.9, .5, 14); rise($('.cta', o), t, 66.4, .6, 20); rise($('.url', o), t, 66.8, .5, 12);
  const oc = $('#ocat'); const ok = ease((t - 66) / .6); oc.style.opacity = ok; oc.style.transform = `translateY(${(1 - ok) * 50 + Math.sin(t * 3) * 4}px) rotate(${Math.sin(t * 2) * 2}deg)`;
  // credits 69–74
  const cr = $('#credits'); cr.style.opacity = clamp((t - 69) / .35) * clamp((74 - t) / .8);
  rise($('.film', cr), t, 69.1, .5, 12); rise($('.rr', cr), t, 69.4, .6, 20); 
};

// ---------- main selling point: the institution dashboard (inserted at 39 s, lasts 7 s) ----------
const DASH_AT = 39, DASH_LEN = 17;
const DSHOTS = [{ img: 'new-dash', box: 'card', at: 0 }, { img: 'new-an', box: 'heat', at: 3.2 }, { img: 'new-an', box: 'act', at: 6.5 }, { img: 'new-console', box: 'all', at: 9.8 }, { img: 'new-att', box: 'list', at: 13.3 }];
add(`<section class="scene dark solved" id="dashf">
  <div class="gh"><span class="num" style="color:var(--mint)">★</span><h2 class="serif">${T.dH}</h2></div>
  <div class="frame new" style="left:80px; top:190px; width:${FW}px; height:${FH}px"><div class="bar"><i></i><i></i><i></i><b class="durl">rfim.github.io/tenang_ai · Dashboard</b></div>
    <div class="view">${DSHOTS.map((sh, i) => `<div class="layer" data-k="${i}"><img src="${LANG}/${sh.img}.png"><div class="hl"></div></div>`).join('')}</div></div>
  <div class="panel"><span class="pill"><svg><use href="#ok"/></svg>${T.dPill}</span>
    <p class="d-eye" style="margin-top:22px;font:600 18px Inter;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)">${T.dEye}</p>
    ${[T.d1, T.d2, T.d3, T.d4, T.d5].map((d, i) => `<div class="dtxt" data-i="${i}" style="position:absolute;left:0;right:0;top:150px;opacity:0"><h3>${d[0]}</h3><p>${d[1]}</p></div>`).join('')}
    <p class="d-foot" style="position:absolute;left:0;right:0;top:500px;margin:0;padding-top:18px;border-top:1px solid rgba(245,236,217,.18);font:500 21px/1.45 Inter;color:rgba(245,236,217,.65)">${T.dP}</p>
  </div></section>`);

function renderDash(t) {
  const el = $('#dashf'), u = t - DASH_AT; el.style.opacity = fadeIO(t, DASH_AT, DASH_AT + DASH_LEN);
  rise($('.gh', el), t, DASH_AT, .5, 20); rise($('.pill', el), t, DASH_AT + .5, .45, 14); rise($('.d-eye', el), t, DASH_AT + .7, .45, 12); rise($('.d-foot', el), t, DASH_AT + 1.2, .5, 12);
  const layers = el.querySelectorAll('.layer');
  DSHOTS.forEach((sh, i) => { const st = DASH_AT + sh.at, end = i + 1 < DSHOTS.length ? DASH_AT + DSHOTS[i + 1].at : DASH_AT + DASH_LEN;
    const L = layers[i]; L.style.opacity = i === 0 ? clamp((end + .3 - t) / .35) : clamp(Math.min((t - st) / .35, (end + .3 - t) / .35));
    camera(L, R(sh.img, sh.box), t, st, end); if (sh.box === 'all') $('.hl', L).style.display = 'none';
    if (t >= st && t < end) $('.durl', el).textContent = (sh.img === 'new-dash' || sh.img === 'new-an') ? 'rfim.github.io/tenang_ai · Dashboard' : 'rfim.github.io/tenang_ai/dashboard.html';
    const tx = el.querySelector('.dtxt[data-i="' + i + '"]'); const k = clamp(Math.min((t - st - .5) / .4, (end + .1 - t) / .3)); tx.style.opacity = k; tx.style.transform = `translateY(${(1 - Math.min(1, (t - st - .5) / .4 < 0 ? 0 : 1)) * 12}px)`; });
  // the whole-dashboard shot gets no highlight box
  $('.layer[data-k="0"] .hl', el).style.display = 'none';
}
const baseRender = window.render;
window.render = function (t) {
  if (t < DASH_AT) { baseRender(t); renderDash(-10); }
  else if (t < DASH_AT + DASH_LEN) { baseRender(DASH_AT - .001 + 100); renderDash(t); }
  else { baseRender(t - DASH_LEN); renderDash(-10); }
};
render(0);
</script>
