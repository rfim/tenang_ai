<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Audiowide&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root { --ph: #2be4c7; --cream: #f5ecd9; --gold: #e2b866; --dim: rgba(245,236,217,.55); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: var(--cream); font-family: "IBM Plex Mono", ui-monospace, monospace; }
.scene { position: absolute; inset: 0; opacity: 0; }
.grid { background-image: linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px); background-size: 48px 48px; }
.scan::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px); }
#spons { position: absolute; left: 0; right: 0; top: 800px; text-align: center; opacity: 0; }
#spons small { display: block; font: 500 18px "IBM Plex Mono"; letter-spacing: .3em; text-transform: uppercase; color: rgba(245,236,217,.6); }
#spons .sl { margin: 22px auto 0; width: max-content; padding: 22px 48px; border-radius: 18px; background: #f5ecd9; box-shadow: 0 0 0 1px rgba(43,228,199,.35), 0 0 40px rgba(43,228,199,.15); display: flex; justify-content: center; align-items: center; gap: 64px; }
#spons img { display: block; }
#spons .cl { display: grid; justify-items: center; gap: 4px; } #spons .cl em { font: 500 15px "IBM Plex Mono"; font-style: normal; color: #3d3a33; letter-spacing: .08em; }
/* part 0: the pioneers */
#pq { position: absolute; left: 0; right: 0; top: 96px; text-align: center; font: 500 30px "IBM Plex Mono"; color: var(--ph); text-shadow: 0 0 10px rgba(43,228,199,.5); white-space: pre; }
.pf { position: absolute; top: 170px; width: 420px; margin: 0; opacity: 0; }
#pf0 { left: 470px; } #pf1 { left: 1030px; }
.pimg { position: relative; width: 420px; height: 520px; padding: 10px; border-radius: 16px; background: #0b1714; border: 2px solid rgba(43,228,199,.45); box-shadow: 0 0 40px rgba(43,228,199,.15); overflow: hidden; }
.pimg img { display: block; width: 400px; height: 500px; object-fit: cover; border-radius: 8px; clip-path: inset(0 0 100% 0); }
.pimg::after { content: ""; position: absolute; inset: 10px; border-radius: 8px; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px); pointer-events: none; }
.sweep { position: absolute; left: 10px; right: 10px; height: 6px; background: var(--ph); box-shadow: 0 0 24px 6px rgba(43,228,199,.7); opacity: 0; }
.pf figcaption { margin-top: 18px; text-align: center; }
.pf figcaption b { display: block; font: 400 25px Audiowide; letter-spacing: .08em; color: var(--ph); }
.pf figcaption .pt { display: block; margin-top: 8px; min-height: 30px; font: 400 21px "IBM Plex Mono"; color: rgba(245,236,217,.88); white-space: pre; }
#pboth { position: absolute; left: 0; right: 0; top: 975px; text-align: center; font: 400 44px Marcellus; letter-spacing: .02em; opacity: 0; }
#pcred { position: absolute; right: 40px; bottom: 22px; font: 400 13px "IBM Plex Mono"; color: rgba(245,236,217,.4); opacity: 0; }
.nophoto { width: 400px; height: 500px; border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 40%, #07332b, #01110e 78%); clip-path: inset(0 0 100% 0); }
.nophoto span { font: 400 120px Audiowide; color: var(--ph); text-shadow: 0 0 24px rgba(43,228,199,.6); letter-spacing: .06em; }
.nophoto small { font: 500 16px "IBM Plex Mono"; letter-spacing: .2em; text-transform: uppercase; color: rgba(245,236,217,.45); }
/* opener */
#mark { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); display: grid; gap: 5px; }
#mark .row { display: flex; gap: 5px; }
#mark i { width: 17px; height: 17px; border-radius: 4px; background: rgba(43,228,199,.06); }
#mark i.on { background: var(--ph); box-shadow: 0 0 14px rgba(43,228,199,.75); }
#mark i.ear { background: #f2a98f; box-shadow: 0 0 12px rgba(242,169,143,.55); }
#mark i.heart { background: #ff8a8a; box-shadow: 0 0 14px rgba(255,138,138,.8); }
#mark i.hot { background: #fff; box-shadow: 0 0 22px rgba(255,255,255,.9); }
#title { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font: 400 76px Audiowide; letter-spacing: .06em; color: var(--ph); text-shadow: 0 0 18px rgba(43,228,199,.45); white-space: pre; }
.cur { display: inline-block; width: .55em; height: 1em; margin-left: 4px; vertical-align: -0.12em; background: var(--ph); }
#sub { position: absolute; left: 0; right: 0; top: 676px; text-align: center; font: 400 28px "IBM Plex Mono"; color: rgba(245,236,217,.82); opacity: 0; }
#meta { position: absolute; left: 0; right: 0; top: 732px; text-align: center; font: 400 19px "IBM Plex Mono"; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); opacity: 0; }
#boot { position: absolute; left: 70px; top: 60px; font: 400 18px/1.7 "IBM Plex Mono"; color: rgba(43,228,199,.65); white-space: pre; }
/* collaboration: two 80s CRT computers pinging each other */
#collab { background: radial-gradient(ellipse at 50% 35%, #0d2a24, #050d0b 70%); }
#collab::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(70,190,160,.16) 1.2px, transparent 1.6px); background-size: 9px 9px;
  -webkit-mask: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 80%); mask: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 80%); }
.pc { position: absolute; top: 70px; width: 620px; opacity: 0; }
.pc .cap { display: flex; align-items: center; gap: 12px; margin: 0 6px 14px; font: 500 22px "IBM Plex Mono"; letter-spacing: .18em; color: var(--cream); }
.pc .cap b { width: 12px; height: 12px; border-radius: 50%; background: var(--ph); box-shadow: 0 0 12px var(--ph); }
.pc .cap .clk { margin-left: auto; color: var(--gold); letter-spacing: .06em; }
.pc .scr { position: relative; height: 400px; padding: 34px 38px 62px; border-radius: 22px 22px 14px 14px;
  background: linear-gradient(160deg, #4fb89c 0%, #2f8c75 45%, #1f6656 100%);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.25), inset 0 -10px 18px rgba(0,0,0,.35), 0 40px 70px -24px rgba(0,0,0,.9); }
.pc .scr::before { content: ""; position: absolute; left: 22px; right: 22px; top: 20px; bottom: 48px; border-radius: 16px; background: linear-gradient(170deg, #1c5a4c, #123f35); box-shadow: inset 0 6px 14px rgba(0,0,0,.55); }
.pc .scr::after { content: ""; position: absolute; left: 44px; bottom: 20px; width: 120px; height: 8px; background: repeating-linear-gradient(90deg, rgba(10,40,33,.7) 0 10px, transparent 10px 16px); }
.pc .term { position: relative; z-index: 1; height: 100%; padding: 18px 22px; border-radius: 26px / 30px; background: radial-gradient(ellipse at 45% 40%, #07332b, #01110e 78%);
  box-shadow: inset 0 0 50px rgba(0,0,0,.85), inset 0 0 0 3px #0b2721; font: 400 18px/1.6 "IBM Plex Mono"; color: var(--ph); text-shadow: 0 0 8px rgba(43,228,199,.55); white-space: pre; overflow: hidden; }
.pc .term::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px), radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.07), transparent 45%); pointer-events: none; }
.pc .term .p { color: var(--cream); } .pc .term .r { color: var(--gold); text-shadow: 0 0 8px rgba(226,184,102,.45); }
.pc .neck { width: 82%; height: 18px; margin: 0 auto; background: linear-gradient(#1b5446, #123b31); border-radius: 0 0 8px 8px; }
.pc .foot { position: relative; width: 104%; height: 64px; margin: 10px -2% 0; border-radius: 10px; background: linear-gradient(#3a9d84, #21705e);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 20px 30px -14px rgba(0,0,0,.8); transform: perspective(500px) rotateX(38deg); transform-origin: top; }
.pc .foot::before { content: ""; position: absolute; left: 18px; right: 18px; top: 10px; bottom: 10px; border-radius: 4px;
  background: repeating-linear-gradient(90deg, #17493d 0 26px, transparent 26px 32px), repeating-linear-gradient(0deg, transparent 0 9px, #2a8a73 9px 13px); opacity: .9; }
.shard { position: absolute; background: #2f9f86; box-shadow: inset 0 0 0 2px rgba(255,255,255,.08); opacity: .8; }
#cable { position: absolute; left: 770px; right: 770px; top: 300px; height: 3px; background: repeating-linear-gradient(90deg, rgba(43,228,199,.55) 0 12px, transparent 12px 22px); opacity: 0; }
.pulse { position: absolute; top: 301px; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; opacity: 0; }
.pulse.out { background: var(--ph); box-shadow: 0 0 18px 4px rgba(43,228,199,.7); }
.pulse.back { background: var(--gold); box-shadow: 0 0 18px 4px rgba(226,184,102,.7); }
.pulse small { position: absolute; left: 50%; top: -38px; transform: translateX(-50%); padding: 4px 10px; border-radius: 5px; background: #0b1a15; border: 1px solid rgba(43,228,199,.45); font: 500 15px "IBM Plex Mono"; color: var(--cream); white-space: nowrap; }
.pulse.back small { border-color: rgba(226,184,102,.5); }
#head { position: absolute; left: 0; right: 0; top: 628px; text-align: center; opacity: 0; }
#head h2 { font: 400 62px/1.12 Marcellus; letter-spacing: .02em; }
#head h2 em { font-style: normal; color: var(--ph); }
#head p { margin-top: 16px; font: 400 25px "IBM Plex Mono"; color: rgba(245,236,217,.8); }
#log { position: absolute; left: 50%; top: 880px; width: 1180px; margin-left: -590px; padding: 18px 26px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(6,10,9,.9); font: 400 21px/1.75 "IBM Plex Mono"; white-space: pre; opacity: 0; }
#log .lo { color: #9cc8ff; } #log .jo { color: var(--gold); } #log .bo { color: var(--ph); }
</style></head>
<body>
<section class="scene grid scan" id="pioneers">
  <div id="pq"></div>
  <figure class="pf" id="pf0"><div class="pimg"><img src="pioneers/turing-duo.png"><i class="sweep"></i></div><figcaption><b>ALAN TURING</b><span class="pt"></span></figcaption></figure>
  <figure class="pf" id="pf1"><div class="pimg"><img src="pioneers/khd-duo.png"><i class="sweep"></i></div><figcaption><b>KI HAJAR DEWANTARA</b><span class="pt"></span></figcaption></figure>
  <div id="pboth"></div>
  <div id="pcred"></div>
</section>
<section class="scene grid scan" id="open">
  <div id="boot"></div>
  <div id="mark"></div>
  <div id="title"></div>
  <div id="sub"></div>
  <div id="meta"></div>
  <div id="spons"><small></small><div class="sl"><img src="logos/creadv-light.svg" style="height:34px"><span class="cl"><img src="logos/claude.svg" style="height:40px"><em>for Startups</em></span><img src="logos/lpdp.png" style="height:74px"><img src="logos/goldsmiths.png" style="height:60px"></div></div>
</section>
<section class="scene grid scan" id="collab">
  <div id="shards"></div>
  <div class="pc" id="pcL" style="left:150px"><div class="cap"><b></b><span class="nm">LONDON</span><span class="clk"></span></div>
    <div class="scr"><div class="term"></div></div><div class="neck"></div><div class="foot"></div></div>
  <div class="pc" id="pcJ" style="right:150px"><div class="cap"><b></b><span class="nm">YOGYAKARTA</span><span class="clk"></span></div>
    <div class="scr"><div class="term"></div></div><div class="neck"></div><div class="foot"></div></div>
  <div id="cable"></div>
  <div id="pulses"></div>
  <div id="head"><h2></h2><p></p></div>
  <div id="log"></div>
</section>
<script>
const LANG = (location.search.match(/lang=(id|en)/) || [, 'en'])[1];
const T = {
  en: { sup: 'Supported by', pq: '> two people, one thread', pf: ['London, 1950: can machines think?', 'Yogyakarta: support from behind'], pboth: 'Thinking machines, and gentle support.', pcred: 'Portraits: Elliott & Fry (1951); Government of Indonesia (before 1959). Public domain.', sub: 'Talking feelings through, together. Research between London and Yogyakarta', meta: 'Research first · AI · mental wellbeing · est. 2026',
    roL: 'Reads the research on AI\ncompanions and wellbeing.', roJ: 'Tests conversations in\neveryday Bahasa Indonesia.',
    h2: 'London <em>×</em> Jogja.<br>Researching AI that listens.', p: '',
    pk: ['papers', 'interview notes', 'conversation drafts', 'safety rules', 'Bahasa Indonesia', 'feedback'],
    log: [['lo', '[london]', 'reading the research on AI companions'], ['jo', '[jogja] ', 'testing conversations with Indonesian users in mind'], ['bo', '[both]  ', 'writing the safety rules together'], ['bo', '>', ' next: N2CIAS']] },
  id: { sup: 'Didukung oleh', pq: '> dua tokoh, satu benang merah', pf: ['London, 1950: dapatkah mesin berpikir?', 'Yogyakarta: tut wuri handayani'], pboth: 'Mesin yang berpikir, dan dukungan yang lembut.', pcred: 'Potret: Elliott & Fry (1951); Pemerintah Indonesia (sebelum 1959). Public domain.', sub: 'Ruang bicara soal perasaan, bersama. Research antara London dan Yogyakarta', meta: 'Research first · AI · mental wellbeing · sejak 2026',
    roL: 'Membaca riset tentang pendamping\nAI dan kesejahteraan.', roJ: 'Menguji percakapan dalam\nBahasa Indonesia sehari-hari.',
    h2: 'London <em>×</em> Jogja.<br>Research AI yang mau mendengarkan.', p: '',
    pk: ['paper', 'catatan interview', 'draft percakapan', 'safety rules', 'Bahasa Indonesia', 'feedback'],
    log: [['lo', '[london]', 'membaca research tentang AI companion'], ['jo', '[jogja] ', 'testing percakapan untuk user Indonesia'], ['bo', '[bersama]', 'menyusun safety rules bersama'], ['bo', '>', ' next: N2CIAS']] },
}[LANG];
const $ = s => document.querySelector(s);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(1 - x, 3);
const fadeIO = (t, a, b, f = .35) => clamp(Math.min((t - a) / f, (b - t) / f));
function rise(el, t, at, d = .6, dy = 24) { const k = ease((t - at) / d); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; }

// the mark: "RR" on a dot-matrix grid, two letters for two cities, joined by a bridge row
// a pixel Nesya: front-facing elephant with big ears and a curled trunk, and a small heart
const GLYPH = [
  '................................*.*.',
  '....###.....#######.....##.....*****',
  '...######..#########..#####.....***.',
  '..##++++###############++++#.....*..',
  '.##++++++#############++++++##......',
  '.##++++++#############++++++##......',
  '.##++++++###.#####.###++++++##......',
  '.##++++++#####.#.#####++++++##......',
  '.##++++++#+###.#.###+#++++++##......',
  '..##+++++#####.#.#####+++++##.......',
  '..###++##.####.#.####.##++###.......',
  '...#####...###.#.###...#####........',
  '............##.#.##.................',
  '...............#....................',
  '...............#.#..................',
  '...............###..................',
];
const mark = $('#mark'); const cells = [];
GLYPH.forEach((row, y) => { const r = document.createElement('div'); r.className = 'row'; [...row].forEach((c, x) => { const i = document.createElement('i'); r.appendChild(i); if (c === '#') cells.push({ el: i, x, y }); else if (c === '+') cells.push({ el: i, x, y, pink: true }); else if (c === '*') cells.push({ el: i, x, y, bridge: true }); }); mark.appendChild(r); });
// light order: the left letter from the top, the right letter from the top, then the bridge
cells.sort((a, b) => (!!a.bridge - !!b.bridge) || (a.x - b.x) || (a.y - b.y));
const BOOT = ['rembug-rasa ~ $ ./init --project research', 'loading nodes ........ london  ok', 'loading nodes ........ jogja   ok', 'handshake ............ ok'];
const TITLE = 'REMBUG RASA PROJECTS';
$('#head h2').innerHTML = T.h2; $('#head p').textContent = T.p; $('#sub').textContent = T.sub; $('#meta').textContent = T.meta;
const pad = n => String(n).padStart(2, '0');
// pings: odd ones go London -> Jogja, even ones come back; each carries a piece of the research
const X0 = 770, X1 = 1150;
const PINGS = T.pk.map((label, i) => ({ label, from: i % 2 ? 'J' : 'L', at: 5.85 + i * .6, d: .55, ms: [182, 179, 185, 181, 184, 180][i] }));
const pulseEls = PINGS.map(p => { const d = document.createElement('div'); d.className = 'pulse ' + (p.from === 'L' ? 'out' : 'back'); d.innerHTML = '<small>' + p.label + '</small>'; $('#pulses').appendChild(d); return d; });
const HOST = { L: 'london', J: 'jogja' };
// pixel shards drifting around the machines, like the screens are breaking into data
const SH = Array.from({ length: 26 }, (_, i) => { const r = (n) => { const x = Math.sin(i * 12.9898 + n * 78.233) * 43758.5453; return x - Math.floor(x); };
  const d = document.createElement('div'); d.className = 'shard'; const w = 8 + r(1) * 34; d.style.width = w + 'px'; d.style.height = (w * (.5 + r(2) * .8)) + 'px';
  $('#shards').appendChild(d); return { el: d, x: r(3) < .5 ? 60 + r(4) * 760 : 1100 + r(4) * 760, y: 40 + r(5) * 560, vx: (r(6) - .5) * 30, vy: -10 - r(7) * 25, rot: r(8) * 360, vr: (r(9) - .5) * 40 }; });

const SHIFT = 4.5;
function renderPioneers(t) {
  const P = $('#pioneers'); P.style.opacity = clamp((t + .1) / .3) * clamp((SHIFT - t) / .4);
  const q = T.pq; $('#pq').textContent = q.slice(0, Math.floor(clamp((t - .15) / .8) * q.length)) + (Math.floor(t * 2.5) % 2 ? '' : '\u2588');
  ['#pf0', '#pf1'].forEach((sel, i) => {
    const at = .5 + i * .6, txt = T.pf[i];
    const f = $(sel); rise(f, t, at, .5, 26);
    const u = clamp((t - at - .2) / .9);
    const pic = $(sel + ' img') || $(sel + ' .nophoto'); pic.style.clipPath = `inset(0 0 ${100 - u * 100}% 0)`;
    const sw = $(sel + ' .sweep'); sw.style.top = (10 + u * 494) + 'px'; sw.style.opacity = u > 0 && u < 1 ? 1 : 0;
    $(sel + ' .pt').textContent = txt.slice(0, Math.floor(clamp((t - at - 1.0) / .8) * txt.length));
  });
  rise($('#pboth'), t, 3.2, .6, 14); $('#pboth').textContent = T.pboth;
  $('#pcred').textContent = T.pcred; $('#pcred').style.opacity = clamp((t - 1) / .5) * .9;
}
const renderMain = function (t) {
  // --- part 1: 0 – 5 s, the mark builds like a screen booting
  $('#open').style.opacity = clamp((t + .1) / .3) * clamp((5.1 - t) / .4);
  const blink = Math.floor(t * 2.5) % 2 === 0;
  // boot log, top left
  const bootChars = Math.floor(clamp((t - .1) / 1.6) * BOOT.join('\n').length);
  $('#boot').textContent = BOOT.join('\n').slice(0, bootChars);
  $('#boot').style.opacity = clamp((4.6 - t) / .6) * .9;
  const n = Math.floor(clamp((t - .5) / 1.9) * cells.length);
  const cls = c => c.bridge ? 'heart' : c.pink ? 'ear' : 'on';
  cells.forEach((c, i) => { c.el.className = i < n - 1 ? cls(c) : i === n - 1 ? 'hot' : ''; });
  if (t > 2.5) cells.forEach(c => c.el.className = cls(c));
  const beat = t > 2.5 ? 1 + .12 * Math.max(0, Math.sin((t - 2.5) * Math.PI * 2)) ** 6 : 1;
  cells.forEach(c => { if (c.bridge) c.el.style.transform = `scale(${beat})`; });
  // title types after the mark, with a block cursor
  const k = Math.floor(clamp((t - 2.35) / 1.0) * TITLE.length);
  $('#title').innerHTML = TITLE.slice(0, k) + (t > 2.2 && (t < 3.5 || blink) ? '<span class="cur"></span>' : '');
  rise($('#sub'), t, 3.4, .6, 14); rise($('#meta'), t, 3.8, .6, 10);
  // --- part 2: 5 – 10 s, London and Jogja working together
  $('#collab').style.opacity = clamp((t - 4.9) / .4) * clamp((10.05 - t) / .4);
  rise($('#pcL'), t, 5.1, .6, 30); rise($('#pcJ'), t, 5.3, .6, 30);
  SH.forEach((p, i) => { const u = t - 5.2; p.el.style.opacity = clamp(u / .6) * .75; p.el.style.transform = `translate(${p.x + p.vx * u}px, ${p.y + p.vy * u}px) rotate(${p.rot + p.vr * u}deg)`; });
  const base = 9 * 3600 + (t - 5) * 900;
  const hL = Math.floor(base / 3600) % 24, mm = Math.floor(base / 60) % 60;
  $('#pcL .clk').textContent = pad(hL) + ':' + pad(mm) + ' GMT'; $('#pcJ .clk').textContent = pad((hL + 6) % 24) + ':' + pad(mm) + ' WIB';
  $('#cable').style.opacity = ease((t - 5.6) / .4);
  ['L', 'J'].forEach(side => {
    const other = side === 'L' ? 'J' : 'L';
    const cmd = HOST[side] + ':~$ ping ' + HOST[other];
    const typed = cmd.slice(0, Math.floor(clamp((t - 5.45 - (side === 'J' ? .15 : 0)) / .5) * cmd.length));
    const lines = ['<span class="p">' + typed + '</span>'];
    if (typed.length === cmd.length) lines.push('PING ' + HOST[other] + ' (' + (other === 'J' ? '7.80.110.36' : '51.51.0.13') + ')');
    let seq = 0;
    PINGS.forEach(p => { if (p.from !== other || t < p.at + p.d) return; seq++;
      lines.push('<span class="r">64 bytes from ' + HOST[other] + ': seq=' + seq + ' time=' + p.ms + ' ms</span>');
      lines.push('  \u2192 ' + p.label); });
    if (t > 9.2) lines.push('<span class="p">--- ' + HOST[other] + ' ping statistics ---</span>', '0% packet loss · connected');
    const blink = Math.floor(t * 2.5) % 2 === 0;
    $('#pc' + side + ' .term').innerHTML = lines.slice(-8).join('\n') + (blink ? '<span class="cur"></span>' : '');
  });
  PINGS.forEach((p, i) => { const el = pulseEls[i], u = (t - p.at) / p.d;
    if (u <= 0 || u >= 1) { el.style.opacity = 0; return; }
    const x = p.from === 'L' ? X0 + (X1 + 0 - X0) * u : X1 - (X1 - X0) * u;
    el.style.left = (x + (p.from === 'L' ? 0 : 0)) + 'px'; el.style.opacity = clamp(Math.min(u / .12, (1 - u) / .12)); });
  rise($('#head'), t, 6.3, .7, 24);
  const log = $('#log'); log.style.opacity = ease((t - 6.9) / .4);
  const all = T.log.map(l => l[1] + ' ' + l[2]); const total = all.join('\n').length;
  let left = Math.floor(clamp((t - 7.0) / 2.3) * total); const out = [];
  T.log.forEach((l, i) => { const line = all[i]; if (left <= 0) return; const s = line.slice(0, left); left -= line.length + 1;
    const tag = s.slice(0, l[1].length), rest = s.slice(l[1].length); out.push(`<span class="${l[0]}">${tag}</span>${rest}`); });
  log.innerHTML = out.join('\n') + (blink ? '<span class="cur"></span>' : '');
};
// hold the Rembug Rasa title for 1.5 s while the supporters appear
const HOLD_AT = 4.6, HOLD = 1.5;
window.render = function (t) {
  renderPioneers(t);
  const m = t - SHIFT;
  renderMain(m < HOLD_AT ? m : m < HOLD_AT + HOLD ? HOLD_AT : m - HOLD);
  const sp = $('#spons'); $('#spons small').textContent = T.sup;
  const k = ease((m - 3.9) / .6); sp.style.opacity = k; sp.style.transform = `translateY(${(1 - k) * 16}px)`;
};
render(0);
</script>
